<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Clip Scale</title>
<style>
  :root{color-scheme:light;--ink:#17211b;--muted:#68746c;--paper:#fbfcf8;--field:#e9eee8;--green:#215c3f;--lime:#c8e66a;--line:#d8dfd8}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;padding:clamp(1rem,4vw,3rem);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--field);color:var(--ink)}
  main{width:min(960px,100%);margin:auto} header{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.25rem}.brand{display:flex;align-items:center;gap:.75rem}.mark{width:2.75rem;height:2.75rem;border-radius:.9rem;display:grid;place-items:center;background:var(--green);color:#fff;font-weight:800}h1{margin:0;font-size:1rem}.eyebrow{margin:.15rem 0 0;color:var(--muted);font-size:.78rem}
  .pill{display:flex;align-items:center;gap:.45rem;padding:.55rem .75rem;border:1px solid var(--line);border-radius:999px;background:#ffffff8c;color:var(--muted);font-size:.78rem}.dot{width:.5rem;height:.5rem;border-radius:50%;background:#a3ada6}.pill.live .dot{background:#4caf6a;box-shadow:0 0 0 4px #4caf6a24}
  .card{background:var(--paper);border:1px solid #17211b14;border-radius:1.75rem;box-shadow:0 18px 50px #2b3b3014;overflow:hidden}.measurement{min-height:390px;padding:clamp(1.5rem,5vw,3.5rem);display:grid;grid-template-columns:1.05fr .95fr;gap:2.5rem;align-items:end}.label{color:var(--muted);font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.readout{margin:1.1rem 0 1.4rem;line-height:.88;letter-spacing:-.075em;white-space:nowrap}#val{font-size:clamp(5rem,14vw,9.5rem);font-weight:720;font-variant-numeric:tabular-nums}#unit{margin-left:.28em;color:var(--muted);font-size:clamp(1.2rem,3vw,2rem);font-weight:600;letter-spacing:0}#measurementStatus{display:flex;gap:.6rem;color:var(--muted);font-size:.88rem}#measurementStatus strong{color:var(--ink)}
  .signal{border-left:1px solid var(--line);padding-left:2rem}.signal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.5rem}.signal-head span:last-child{color:var(--muted);font-size:.72rem}#chart{display:block;width:100%;height:145px;overflow:visible}#trace{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.gridline{stroke:var(--line)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.7rem}.metric{border-top:1px solid var(--line);padding-top:.8rem}.metric span{display:block;color:var(--muted);font-size:.72rem;margin-bottom:.3rem}.metric strong{font-size:.92rem}
  .controls{padding:1rem 1.25rem;display:flex;flex-wrap:wrap;gap:.7rem;border-top:1px solid var(--line);background:#ffffff80}button{border:0;border-radius:999px;padding:.8rem 1.1rem;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;background:var(--green);color:#fff}button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}button.demo{margin-left:auto;background:var(--lime);color:var(--ink)}button:disabled{opacity:.4}footer{margin-top:.9rem;color:var(--muted);font-size:.72rem;text-align:center}
  @media(max-width:720px){.measurement{grid-template-columns:1fr;align-items:start}.signal{border-left:0;border-top:1px solid var(--line);padding:1.75rem 0 0}button.demo{margin-left:0}header{align-items:flex-start}}
</style>
</head>
<body><main>
  <header><div class="brand"><div class="mark">SC</div><div><h1>Smart Clip Scale</h1><p class="eyebrow">Hanging-load prototype</p></div></div><div id="sourceStatus" class="pill"><span class="dot"></span><span>Not connected</span></div></header>
  <section class="card">
    <div class="measurement">
      <div><div class="label">Current load</div><div class="readout"><span id="val">––</span><span id="unit">g</span></div><div id="measurementStatus"><strong>Waiting for data</strong><span>—</span><span>no samples</span></div></div>
      <div class="signal"><div class="signal-head"><span class="label">Live signal</span><span>last 30 seconds</span></div><svg id="chart" viewBox="0 0 360 145" preserveAspectRatio="none" aria-label="Recent readings"><line class="gridline" x1="0" y1="25" x2="360" y2="25"/><line class="gridline" x1="0" y1="72.5" x2="360" y2="72.5"/><line class="gridline" x1="0" y1="120" x2="360" y2="120"/><polyline id="trace" points=""/></svg><div class="metrics"><div class="metric"><span>Source</span><strong id="source">None</strong></div><div class="metric"><span>Update rate</span><strong id="rate">—</strong></div></div></div>
    </div>
    <div class="controls"><button id="bluetooth">Connect Bluetooth</button><button id="serial" class="secondary">Connect USB</button><button id="zero" class="secondary" disabled>Zero</button><button id="demo" class="demo">Run demo</button></div>
  </section><footer>Prototype interface · Chrome or Edge required for Bluetooth and USB</footer>
</main>
<script>
const SVC="5f6d0001-1e2d-4b3a-9c8f-0a1b2c3d4e5f",CHR="5f6d0002-1e2d-4b3a-9c8f-0a1b2c3d4e5f";
const $=id=>document.getElementById(id),val=$("val"),pill=$("sourceStatus"),state=$("measurementStatus"),source=$("source"),rate=$("rate"),trace=$("trace"),zero=$("zero"),demo=$("demo");
let raw=null,tare=0,history=[],lastAt=null,demoTimer=null;
function setSource(name,live=false){source.textContent=name;pill.classList.toggle("live",live);pill.lastElementChild.textContent=live?name+" live":name}
function pushReading(n){if(!Number.isFinite(n))return;const now=performance.now();if(lastAt)rate.textContent=(1000/(now-lastAt)).toFixed(1)+" Hz";lastAt=now;raw=n;history.push(n-tare);if(history.length>60)history.shift();zero.disabled=false;render()}
function render(){if(raw===null)return;val.textContent=(raw-tare).toFixed(1);const recent=history.slice(-12),spread=recent.length>2?Math.max(...recent)-Math.min(...recent):Infinity;state.innerHTML=`<strong>${spread<.8?"Stable":"Settling"}</strong><span>—</span><span>${recent.length} recent samples</span>`;if(history.length<2)return;const lo=Math.min(...history),span=Math.max(Math.max(...history)-lo,1);trace.setAttribute("points",history.map((v,i)=>`${(i*360/Math.max(history.length-1,1)).toFixed(1)},${(120-(v-lo)/span*95).toFixed(1)}`).join(" "))}
function stopDemo(){if(demoTimer)clearInterval(demoTimer);demoTimer=null;demo.textContent="Run demo"}
demo.onclick=()=>{if(demoTimer){stopDemo();setSource("Demo stopped");return}history=[];tare=0;lastAt=null;const started=performance.now();setSource("Demo",true);demo.textContent="Stop demo";demoTimer=setInterval(()=>{const t=(performance.now()-started)/1000;pushReading(642.7+36*Math.exp(-t/2.2)*Math.cos(t*5.2)+(Math.random()-.5)*.35)},500)};
zero.onclick=()=>{if(raw!==null){tare=raw;history=[];pushReading(raw)}};
$("bluetooth").onclick=async()=>{stopDemo();if(!navigator.bluetooth){setSource("Bluetooth unsupported");return}try{setSource("Choose scale…");const device=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]}],optionalServices:[SVC]});device.addEventListener("gattserverdisconnected",()=>setSource("Bluetooth disconnected"));const server=await device.gatt.connect(),service=await server.getPrimaryService(SVC),characteristic=await service.getCharacteristic(CHR);await characteristic.startNotifications();characteristic.addEventListener("characteristicvaluechanged",e=>pushReading(parseFloat(new TextDecoder().decode(e.target.value))));setSource("Bluetooth",true)}catch(e){setSource("Bluetooth: "+e.message)}};
$("serial").onclick=async()=>{stopDemo();if(!navigator.serial){setSource("USB serial unsupported");return}try{const port=await navigator.serial.requestPort();await port.open({baudRate:115200});setSource("USB serial",true);const decoder=new TextDecoderStream();port.readable.pipeTo(decoder.writable).catch(()=>{});const reader=decoder.readable.getReader();let buffer="";while(true){const {value,done}=await reader.read();if(done)break;buffer+=value;const lines=buffer.split(/\r?\n/);buffer=lines.pop();for(const line of lines)pushReading(parseFloat(line))}}catch(e){setSource("USB: "+e.message)}};
</script></body></html>
